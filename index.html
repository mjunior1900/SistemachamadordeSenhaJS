<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brasa & Sabor - Painel</title>
<style>
body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif}
.topo{display:flex;justify-content:space-between;align-items:center;padding:20px 40px;background:#7b0000;border-bottom:5px solid orange}
.logo{height:70px}
.empresa{font-size:42px;font-weight:bold}
.evento{color:#ffc107}
#relogio{text-align:right}
.conteudo{display:flex;justify-content:space-between;align-items:center;padding:25px}
.painelPedido{width:58%;text-align:center}
.textoPedido{font-size:42px;font-weight:bold}
#senhaAtualNumero{font-size:260px;font-weight:bold;color:#FFD600;text-shadow:0 0 15px #ff9800,0 0 35px #ff9800,0 0 70px red}
.video{width:38%;height:420px;border:4px solid orange;border-radius:15px;overflow:hidden}
.video video{width:100%;height:100%;object-fit:cover}
.ultima{width:60%;margin:20px auto;text-align:center;background:#222;padding:15px;border-radius:10px}
.ultimaTitulo{font-size:28px;color:#ffc107}
#ultimaSenhaNumero{font-size:72px}
.rodape{background:#7b0000;padding:15px;text-align:center}
</style>
</head>
<body>
<div class="topo">
<img class="logo" src="imagens/logo-brasa.png">
<div><div class="empresa">BRASA & SABOR</div><div class="evento">Festa Gospel • Beira Rio • Sapucaia/RJ</div></div>
<div id="relogio"></div>
</div>

<div class="conteudo">
<div class="painelPedido">
<div class="textoPedido">RETIRAR PEDIDO</div>
<div id="senhaAtualNumero">001</div>
</div>
<div class="video">
<video autoplay muted loop playsinline>
<source src="videos/propaganda.mp4" type="video/mp4">
</video>
</div>
</div>

<div class="ultima">
<div class="ultimaTitulo">ÚLTIMO PEDIDO CHAMADO</div>
<div id="ultimaSenhaNumero">000</div>
</div>

<div class="rodape">🍢 Obrigado pela preferência • Brasa & Sabor 🍢</div>

<input type="hidden" id="senhaNormal" value="001">
<input type="hidden" id="senhaPrioridade" value="P000">
<audio id="audioChamada" src="audio/chamada.wav"></audio>

<script>
function atualizarRelogio(){
const a=new Date();
document.getElementById('relogio').innerHTML=a.toLocaleDateString('pt-BR')+'<br>'+a.toLocaleTimeString('pt-BR');
}
setInterval(atualizarRelogio,1000);atualizarRelogio();
</script>
<script src="lib/jquery-3.3.1.min.js"></script>
<script src="lib/scripts.js"></script>
</body>
</html>
