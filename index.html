<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brasa & Sabor - Painel</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111;color:#fff;font-family:Arial,sans-serif;overflow:hidden}
.topo{display:flex;align-items:center;justify-content:space-between;height:140px;padding:20px 40px;background:#7b0000;border-bottom:6px solid #ff9800}
.logo{height:110px;width:auto}.tituloEmpresa{flex:1;text-align:center}
.empresa{font-size:54px;font-weight:bold}.evento{font-size:34px;font-weight:bold;color:#FFD600}.local{font-size:24px}
#relogio{width:280px;text-align:right;font-size:34px;font-weight:bold}
.conteudo{display:flex;gap:25px;padding:18px;height:calc(100vh - 220px)}
.ladoEsquerdo{width:30%;display:flex;flex-direction:column}
.painelPedido{text-align:center}
.textoPedido{font-size:40px;font-weight:bold}
#senhaAtualNumero{font-size:220px;line-height:1;color:#FFD600;text-shadow:0 0 15px #ff9800,0 0 40px #ff9800,0 0 70px red}
.ultima{margin-top:15px;background:#1b1b1b;border:3px solid #444;border-radius:12px;padding:12px;text-align:center}
.ultimaTitulo{font-size:26px;color:#ffc107;font-weight:bold}
#ultimaSenhaNumero{font-size:72px}
.video{width:70%;border:5px solid #ff9800;border-radius:20px;overflow:hidden;box-shadow:0 0 25px #000}
.video video{width:100%;height:100%;object-fit:cover;background:#000}
.rodape{height:60px;background:#7b0000;display:flex;align-items:center;justify-content:center;font-size:22px}
</style>
</head>
<body>
<div class="topo">
<img src="imagens/imagens-logo-brasa.png" class="logo">
<div class="tituloEmpresa">
<div class="empresa">BRASA & SABOR</div>
<div class="evento">FESTA GOSPEL 2026</div>
<div class="local">Beira Rio - Sapucaia</div>
</div>
<div id="relogio"></div>
</div>
<div class="conteudo">
<div class="ladoEsquerdo">
<div class="painelPedido">
<div class="textoPedido">RETIRAR PEDIDO</div>
<div id="senhaAtualNumero">001</div>
</div>
<div class="ultima">
<div class="ultimaTitulo">ÚLTIMO PEDIDO CHAMADO</div>
<div id="ultimaSenhaNumero">000</div>
</div>
</div>
<div class="video">
<video autoplay muted loop playsinline>
<source src="videos/propaganda.mp4" type="video/mp4">
</video>
</div>
</div>
<div class="rodape">🍢 Obrigado pela preferência • Brasa &amp; Sabor 🍢</div>
<input type="hidden" id="senhaNormal" value="001">
<input type="hidden" id="senhaPrioridade" value="P000">
<audio id="audioChamada" src="audio/chamada.wav"></audio>
<script>
function r(){const d=new Date();relogio.innerHTML=d.toLocaleDateString('pt-BR')+'<br>'+d.toLocaleTimeString('pt-BR')}
setInterval(r,1000);r();
</script>
<script src="lib/jquery-3.3.1.min.js"></script>
<script src="lib/scripts.js"></script>
</body>
</html>
